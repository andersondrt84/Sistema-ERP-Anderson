services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: erp_pass
      POSTGRES_DB: erp_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_user -d erp_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://erp_user:erp_pass@db:5432/erp_db
      SECRET_KEY: troque-esta-chave-em-producao
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
    expose:
      - "8000"

  web-http:
    image: nginx:1.27-alpine
    depends_on:
      - api
    volumes:
      - ./nginx/http.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"

  web-https:
    image: nginx:1.27-alpine
    depends_on:
      - api
    profiles: ["https"]
    volumes:
      - ./nginx/https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "443:443"

volumes:
  postgres_data:
